name: Provision Node

on:
  push:
    branches: [main]
    paths:
      - 'nodes/*.yaml'

jobs:
  provision:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup yq
        run: |
          wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          chmod +x /usr/local/bin/yq

      - name: Get changed files
        id: changed
        run: |
          files=$(git diff --name-only HEAD~1 -- 'nodes/*.yaml' | tr '\n' ' ')
          echo "files=$files" >> $GITHUB_OUTPUT
          echo "Changed files: $files"

      - name: Provision new nodes
        env:
          CENTRAL_API_URL: ${{ secrets.CENTRAL_API_URL }}
          CENTRAL_API_ADMIN_KEY: ${{ secrets.CENTRAL_API_ADMIN_KEY }}
        run: |
          for file in ${{ steps.changed.outputs.files }}; do
            if [ ! -f "$file" ]; then
              echo "File removed, skipping: $file"
              continue
            fi

            echo "Processing: $file"

            node_id=$(yq '.metadata.name' "$file")
            display_name=$(yq '.spec.displayName' "$file")
            endpoint=$(yq '.spec.connectivity.endpoint' "$file")
            connectivity_type=$(yq '.spec.connectivity.type' "$file")
            email=$(yq '.spec.operator.email' "$file")
            location=$(yq '.spec.location.description // ""' "$file")
            lat=$(yq '.spec.location.coordinates.latitude // null' "$file")
            lng=$(yq '.spec.location.coordinates.longitude // null' "$file")

            echo "Registering node: $node_id"

            # Build JSON payload
            payload=$(cat <<EOF
          {
            "nodeId": "$node_id",
            "displayName": "$display_name",
            "endpoint": "https://$endpoint",
            "connectivityType": "$connectivity_type",
            "operatorEmail": "$email",
            "locationDescription": "$location"
          }
          EOF
          )

            # Add coordinates if present
            if [ "$lat" != "null" ] && [ "$lng" != "null" ]; then
              payload=$(echo "$payload" | jq --arg lat "$lat" --arg lng "$lng" '. + {latitude: ($lat | tonumber), longitude: ($lng | tonumber)}')
            fi

            # Call central API
            response=$(curl -sf -X POST "$CENTRAL_API_URL/api/admin/network/nodes" \
              -H "Authorization: Bearer $CENTRAL_API_ADMIN_KEY" \
              -H "Content-Type: application/json" \
              -d "$payload" || echo '{"error": "API call failed"}')

            echo "Response: $response"

            if echo "$response" | jq -e '.error' > /dev/null 2>&1; then
              echo "Warning: Node registration returned error"
            else
              echo "Node registered successfully: $node_id"
            fi
          done

      - name: Apply Istio ServiceEntries
        if: ${{ secrets.KUBECONFIG_DATA != '' }}
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG_DATA }}
        run: |
          echo "$KUBECONFIG_DATA" | base64 -d > /tmp/kubeconfig
          export KUBECONFIG=/tmp/kubeconfig

          for file in ${{ steps.changed.outputs.files }}; do
            if [ ! -f "$file" ]; then
              echo "File removed, handling deletion"
              # Extract node_id from filename
              node_id=$(basename "$file" .yaml)
              kubectl delete serviceentry "$node_id" -n lll-network --ignore-not-found
              continue
            fi

            node_id=$(yq '.metadata.name' "$file")
            endpoint=$(yq '.spec.connectivity.endpoint' "$file")

            echo "Creating ServiceEntry for: $node_id"

            cat <<EOF | kubectl apply -f -
          apiVersion: networking.istio.io/v1beta1
          kind: ServiceEntry
          metadata:
            name: $node_id
            namespace: lll-network
          spec:
            hosts:
            - $endpoint
            location: MESH_EXTERNAL
            ports:
            - number: 443
              name: https
              protocol: HTTPS
            resolution: DNS
          EOF

            echo "ServiceEntry created: $node_id"
          done

          rm /tmp/kubeconfig

      - name: Summary
        run: |
          echo "## Provisioning Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Processed nodes:" >> $GITHUB_STEP_SUMMARY
          for file in ${{ steps.changed.outputs.files }}; do
            echo "- $(basename $file .yaml)" >> $GITHUB_STEP_SUMMARY
          done

  notify:
    needs: provision
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup yq
        run: |
          wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          chmod +x /usr/local/bin/yq

      - name: Send welcome emails
        env:
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
        run: |
          if [ -z "$SENDGRID_API_KEY" ]; then
            echo "SendGrid not configured, skipping notifications"
            exit 0
          fi

          files=$(git diff --name-only HEAD~1 -- 'nodes/*.yaml')
          for file in $files; do
            if [ ! -f "$file" ]; then
              continue
            fi

            email=$(yq '.spec.operator.email' "$file")
            node_id=$(yq '.metadata.name' "$file")
            display_name=$(yq '.spec.displayName' "$file")

            echo "Would send welcome email to: $email for node: $node_id"
            # In production, integrate with SendGrid or similar
          done
