# LLL Network Node Registration
# Node: lll-lite-1-cafebabe
# Type: TypeScript/Express + PostgreSQL

apiVersion: lll.network/v1
kind: NetworkNode
metadata:
  name: lll-lite-1-cafebabe
  labels:
    region: local
    type: home-node
    environment: beta-staging
    stack: typescript
spec:
  displayName: "Lite-1 Beta Staging Node"

  operator:
    email: "admin@littlelibrary.local"

  connectivity:
    type: manual
    endpoint: http://192.168.0.141:13001
    uiUrl: http://192.168.0.141:13001
    apiBaseUrl: http://192.168.0.141:13001

  location:
    description: "Local Development Environment"

  # Default to public for testing
  privacyTier: public

  compatibility:
    profile: lll-lite
    version: 0.1.0
    capabilities: [health, boxes, books, box-inventory]

  consent:
    publishManifest: true
    publishCatalog: false
    publishLocation: false
