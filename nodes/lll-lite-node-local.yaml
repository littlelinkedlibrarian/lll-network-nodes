# LLL Network Node Registration
# Node: lll-lite-node-local
# Type: TypeScript/Express + PostgreSQL (Drizzle)

apiVersion: lll.network/v1
kind: NetworkNode
metadata:
  name: lll-lite-node-local
  labels:
    region: local
    type: development-node
    environment: development
    stack: typescript
spec:
  displayName: "My LLL Node"

  operator:
    email: "operator@example.com"

  connectivity:
    type: manual
    endpoint: "http://localhost:13001"
    uiUrl: "http://localhost:13001"
    apiBaseUrl: "http://localhost:13001"

  location:
    description: ""

  privacyTier: public

  compatibility:
    profile: lll-lite
    version: 0.1.0
    capabilities: [health, boxes, books, box-inventory]

  consent:
    publishManifest: true
    publishCatalog: false
    publishLocation: false
